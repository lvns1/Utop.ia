<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>UtopIA — Storyboard (US01–US19)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b1b1b;
    --paper:#f7f6f3;
    --card:#ffffff;
    --rule:#1b1b1b;
    --muted:#8b8985;
    --cap:#3a3936;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    line-height:1.45;
  }

  header{max-width:1120px;margin:0 auto;padding:52px 26px 18px;}
  .sheet-no{font-family:'Caveat',cursive;font-size:22px;color:var(--muted);}
  header h1{font-size:32px;font-weight:600;margin:2px 0 6px;letter-spacing:-.015em;}
  header .sub{margin:0;color:var(--muted);font-size:14px;max-width:580px;}
  .rule{max-width:1120px;margin:16px auto 0;padding:0 26px;}
  .rule div{border-top:2px solid var(--rule);}
  header .hint{max-width:1120px;margin:12px auto 0;padding:0 26px;font-size:12.5px;color:var(--muted);}
  header .hint b{color:var(--ink);font-weight:600;}

  main{max-width:1120px;margin:0 auto;padding:0 26px 90px;}

  .act-head{display:flex;align-items:baseline;gap:12px;margin:52px 0 20px;}
  .act-head .n{font-family:'Caveat',cursive;font-size:26px;line-height:1;color:var(--ink);}
  .act-head .t{font-size:15px;font-weight:600;}
  .act-head .r{color:var(--muted);font-size:12.5px;margin-left:auto;}
  .act-head::after{content:"";}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:30px 26px;}
  @media(max-width:760px){ .grid{grid-template-columns:1fr;} }

  .panel{
    background:var(--card);
    border:1.5px solid var(--ink);
    cursor:pointer;
    position:relative;
    transition:box-shadow .16s ease, transform .16s ease;
  }
  .panel:hover{box-shadow:6px 6px 0 rgba(0,0,0,.06);transform:translate(-1.5px,-1.5px);}
  .panel:focus-visible{outline:2px solid #000;outline-offset:3px;}

  .shot{position:relative;border-bottom:1.5px solid var(--ink);}
  .shot svg{display:block;width:100%;height:auto;}
  .idx{
    position:absolute;top:-1px;left:-1px;
    background:var(--ink);color:#fff;
    font-family:'Caveat',cursive;font-size:17px;line-height:1;
    padding:5px 9px 6px;
  }
  .us{
    position:absolute;top:8px;right:10px;
    font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--muted);
  }

  .cap{padding:10px 12px 12px;display:flex;gap:10px;align-items:flex-start;}
  .cam{
    font-family:'Caveat',cursive;font-size:19px;line-height:1.1;
    white-space:nowrap;padding-top:1px;
  }
  .cap p{margin:0;font-size:12.5px;color:var(--cap);}
  .plus{
    margin-left:auto;flex:none;width:19px;height:19px;border:1px solid #c9c7c2;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);
    transition:transform .2s ease;
  }
  .panel.open .plus{transform:rotate(45deg);}

  .more{max-height:0;overflow:hidden;transition:max-height .26s ease;border-top:1px dashed #d6d4cf;}
  .panel.open .more{max-height:240px;}
  .more-in{padding:11px 12px 13px;}
  .more-in p{margin:0 0 9px;font-size:11.5px;color:var(--cap);}
  .tags{display:flex;flex-wrap:wrap;gap:5px;}
  .tag{font-size:10px;padding:3px 8px;border:1px solid #d6d4cf;border-radius:20px;color:#6b6965;}

  footer{max-width:1120px;margin:0 auto;padding:22px 26px 70px;border-top:2px solid var(--rule);color:var(--muted);font-size:12px;}

  /* traço */
  .ln{fill:none;stroke:#1b1b1b;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
  .ln-t{fill:none;stroke:#1b1b1b;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
  .ln-h{fill:none;stroke:#1b1b1b;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round;}
  .fl{fill:#1b1b1b;stroke:none;}
  .fl-s{fill:#1b1b1b;opacity:.72;stroke:none;}
  .pencil{filter:url(#pencil);}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="pencil" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="hL" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#1b1b1b" stroke-width=".55" opacity=".33"/>
    </pattern>
    <pattern id="hM" width="4.4" height="4.4" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="4.4" stroke="#1b1b1b" stroke-width=".7" opacity=".5"/>
    </pattern>
    <pattern id="hD" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="3.4" stroke="#1b1b1b" stroke-width=".95" opacity=".62"/>
      <line x1="0" y1="0" x2="3.4" y2="0" stroke="#1b1b1b" stroke-width=".7" opacity=".4"/>
    </pattern>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".85" fill="#1b1b1b" opacity=".3"/>
      <circle cx="6.5" cy="6" r=".6" fill="#1b1b1b" opacity=".22"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b1b1b"/>
    </marker>
    <clipPath id="fr"><rect x="7" y="7" width="386" height="211"/></clipPath>
  </defs>
</svg>

<header>
  <div class="sheet-no">UtopIA / storyboard</div>
  <h1>Sequência de jogo — US01 a US19</h1>
  <p class="sub">Dezenove quadros na ordem de execução, da abertura do menu ao ranking final.</p>
</header>
<div class="rule"><div></div></div>
<div class="hint">Toque em um quadro para abrir os <b>critérios de aceite</b> da história correspondente.</div>

<main id="main"></main>
<footer>UtopIA — documento de apoio ao sprint · jogo em C com raylib</footer>

<script>
/* ============ helpers de desenho ============ */
const VB = {w:400, h:225};

function frameEdge(){
  return `<path class="ln-t" d="M6 6 L394 7 L393 219 L7 218 Z" opacity=".85"/>`;
}
function sky(op){
  const o = op==null?1:op;
  return `<rect x="0" y="0" width="400" height="118" fill="url(#hL)" opacity="${o*0.58}"/>
          <rect x="0" y="0" width="400" height="62" fill="url(#hL)" opacity="${o*0.42}"/>`;
}
function band(x,y,w,h,pat,op){ return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#${pat})" opacity="${op==null?1:op}"/>`; }

function ground(y, wob){
  const w = wob||0;
  return `<path class="ln-t" d="M0 ${y} Q100 ${y-w} 200 ${y} T400 ${y}"/>`;
}
function persp(y, cx, n){
  let s='';
  for(let i=0;i<n;i++){
    const t=(i/(n-1))*2-1;
    s+=`<line class="ln-t" x1="${cx+t*300}" y1="225" x2="${cx+t*26}" y2="${y}" opacity=".3"/>`;
  }
  return s;
}
function arrow(d, cls){ return `<path class="${cls||'ln'}" d="${d}" marker-end="url(#ah)" fill="none"/>`; }

/* figura humana: poses em sistema local 100x100 (pés em y=100) */
const HAIR = {
  none:'',
  short:`<path class="ln-t" d="M42 9 Q50 1 58 9 Q54 5 50 5 Q46 5 42 9 Z" fill="#1b1b1b" opacity=".85"/>`,
  mop:`<path class="fl" d="M41 11 Q42 1 50 1 Q59 1 59 11 Q56 6 50 6 Q44 6 41 11 Z" opacity=".9"/>`,
  back:`<path class="fl" d="M41 12 Q41 2 50 2 Q59 2 59 12 Q56 8 50 8 Q44 8 41 12 Z" opacity=".9"/>`
};
function facePlain(){
  return `<circle class="fl" cx="46.6" cy="12" r="1.15"/><circle class="fl" cx="53.4" cy="12" r="1.15"/>
          <path class="ln-t" d="M47 16.4 Q50 18 53 16.4" stroke-width="1.2"/>`;
}
function faceTense(){
  return `<path class="ln-t" d="M44.4 9.6 L47.6 10.9 M55.6 9.6 L52.4 10.9" stroke-width="1.2"/>
          <circle class="fl" cx="46.8" cy="12.4" r="1.15"/><circle class="fl" cx="53.2" cy="12.4" r="1.15"/>
          <path class="ln-t" d="M47 17.2 Q50 15.6 53 17.2" stroke-width="1.2"/>`;
}
function faceOpen(){
  return `<circle class="fl" cx="46.6" cy="11.6" r="1.3"/><circle class="fl" cx="53.4" cy="11.6" r="1.3"/>
          <ellipse class="ln-t" cx="50" cy="17" rx="2.4" ry="2.9" stroke-width="1.2"/>`;
}
const FACE = {plain:facePlain, tense:faceTense, open:faceOpen, none:()=>''};

const TORSO = `<path class="ln" d="M41.5 27 Q50 23.6 58.5 27 L56.6 57 Q50 60.4 43.4 57 Z"/>`;

const POSES = {
  stand: (o)=>`
    <circle class="ln" cx="50" cy="12" r="8.4"/>${HAIR[o.hair||'short']}${FACE[o.face||'plain']()}
    <line class="ln-t" x1="50" y1="20.4" x2="50" y2="25"/>
    ${TORSO}
    <path class="ln" d="M42.6 29.5 Q36.6 41 38 53"/><path class="ln" d="M57.4 29.5 Q63.4 41 62 53"/>
    <circle class="fl" cx="38" cy="54.4" r="2.1"/><circle class="fl" cx="62" cy="54.4" r="2.1"/>
    <path class="ln" d="M46 58.6 Q43.4 79 43.4 96"/><path class="ln" d="M54 58.6 Q56.6 79 56.6 96"/>
    <path class="ln" d="M43.4 96.6 L36.4 99"/><path class="ln" d="M56.6 96.6 L63.6 99"/>`,
  back: (o)=>`
    <circle class="ln" cx="50" cy="12" r="8.4"/>${HAIR.back}
    <line class="ln-t" x1="50" y1="20.4" x2="50" y2="25"/>
    ${TORSO}<line class="ln-t" x1="50" y1="28" x2="50" y2="56" opacity=".55"/>
    <path class="ln" d="M42.6 29.5 Q36.6 41 38 53"/><path class="ln" d="M57.4 29.5 Q63.4 41 62 53"/>
    <circle class="fl" cx="38" cy="54.4" r="2.1"/><circle class="fl" cx="62" cy="54.4" r="2.1"/>
    <path class="ln" d="M46 58.6 Q43.4 79 43.4 96"/><path class="ln" d="M54 58.6 Q56.6 79 56.6 96"/>
    <path class="ln" d="M43.4 96.6 L36.4 99"/><path class="ln" d="M56.6 96.6 L63.6 99"/>`,
  point: (o)=>`
    <circle class="ln" cx="50" cy="12" r="8.4"/>${HAIR[o.hair||'short']}${FACE[o.face||'plain']()}
    <line class="ln-t" x1="50" y1="20.4" x2="50" y2="25"/>
    ${TORSO}
    <path class="ln" d="M42.6 29.5 Q36.6 41 38 53"/><circle class="fl" cx="38" cy="54.4" r="2.1"/>
    <path class="ln" d="M57.4 29.5 Q70 27.4 83 25.6"/><circle class="fl" cx="84.6" cy="25.2" r="2.1"/>
    <path class="ln" d="M46 58.6 Q43.4 79 43.4 96"/><path class="ln" d="M54 58.6 Q56.6 79 56.6 96"/>
    <path class="ln" d="M43.4 96.6 L36.4 99"/><path class="ln" d="M56.6 96.6 L63.6 99"/>`,
  walk: (o)=>`
    <circle class="ln" cx="50" cy="12" r="8.4"/>${HAIR[o.hair||'short']}${FACE[o.face||'plain']()}
    <line class="ln-t" x1="50" y1="20.4" x2="50" y2="25"/>
    ${TORSO}
    <path class="ln" d="M42.6 29.5 Q34.6 38 31.4 48"/><circle class="fl" cx="30.6" cy="49.6" r="2.1"/>
    <path class="ln" d="M57.4 29.5 Q65.4 40 68.6 47"/><circle class="fl" cx="69.4" cy="48.6" r="2.1"/>
    <path class="ln" d="M46 58.6 Q39 76 32.4 94"/><path class="ln" d="M54 58.6 Q62 75 69.4 92"/>
    <path class="ln" d="M32.4 94.4 L25.6 97.6"/><path class="ln" d="M69.4 92.4 L76.6 95.6"/>`,
  kneel: (o)=>`
    <circle class="ln" cx="50" cy="30" r="8.4"/>
    <g transform="translate(0,18)">${HAIR[o.hair||'short']}${FACE[o.face||'plain']()}</g>
    <line class="ln-t" x1="50" y1="38.4" x2="50" y2="43"/>
    <path class="ln" d="M41.5 45 Q50 41.6 58.5 45 L56.6 73 Q50 76.4 43.4 73 Z"/>
    <path class="ln" d="M57.4 47.5 Q70 57 77 68"/><circle class="fl" cx="78.4" cy="69.4" r="2.1"/>
    <path class="ln" d="M42.6 47.5 Q36 57 39.4 66"/><circle class="fl" cx="40.4" cy="67.6" r="2.1"/>
    <path class="ln" d="M46 74.6 Q38.6 86 46 97"/><path class="ln" d="M54 74.6 Q65 84 65.4 96.6"/>
    <path class="ln" d="M46 97 L39 99.4"/><path class="ln" d="M65.4 96.6 L72.4 99"/>`,
  guard: (o)=>`
    <circle class="ln" cx="50" cy="14" r="8.4"/>
    <g transform="translate(0,2)">${HAIR[o.hair||'short']}${FACE[o.face||'tense']()}</g>
    <line class="ln-t" x1="50" y1="22.4" x2="50" y2="27"/>
    <path class="ln" d="M41.5 29 Q50 25.6 58.5 29 L56.6 58 Q50 61.4 43.4 58 Z"/>
    <path class="ln" d="M42.6 31.5 Q33.4 26 35.4 14.6"/><circle class="fl" cx="35.6" cy="13" r="2.1"/>
    <path class="ln" d="M57.4 31.5 Q66.6 26 64.6 14.6"/><circle class="fl" cx="64.4" cy="13" r="2.1"/>
    <path class="ln" d="M46 59.6 Q41.4 79 39.4 96"/><path class="ln" d="M54 59.6 Q58.6 79 60.6 96"/>
    <path class="ln" d="M39.4 96.6 L32.4 99"/><path class="ln" d="M60.6 96.6 L67.6 99"/>`,
  lunge: (o)=>`
    <g transform="rotate(9 50 60)">
      <circle class="ln" cx="50" cy="15" r="8.4"/>
      <g transform="translate(0,3)">${HAIR[o.hair||'short']}${FACE[o.face||'tense']()}</g>
      <line class="ln-t" x1="50" y1="23.4" x2="50" y2="28"/>
      <path class="ln" d="M41.5 30 Q50 26.6 58.5 30 L56.6 59 Q50 62.4 43.4 59 Z"/>
      <path class="ln" d="M57.4 32.5 Q71 29 85 24.4"/><circle class="fl" cx="86.6" cy="23.8" r="2.1"/>
      <path class="ln" d="M42.6 32.5 Q33.4 43 31.4 53"/><circle class="fl" cx="30.6" cy="54.6" r="2.1"/>
      <path class="ln" d="M54 60.6 Q66 76 78 90"/><path class="ln" d="M46 60.6 Q36.6 80 26.6 94"/>
      <path class="ln" d="M78 90.4 L85.4 92.4"/><path class="ln" d="M26.6 94.4 L19.6 96.6"/>
    </g>`,
  awe: (o)=>`
    <circle class="ln" cx="50" cy="13" r="8.4"/>
    <g transform="translate(0,1)">${HAIR[o.hair||'short']}${FACE[o.face||'open']()}</g>
    <line class="ln-t" x1="50" y1="21.4" x2="50" y2="26"/>
    ${TORSO}
    <path class="ln" d="M42.6 29.5 Q31.4 37 27.4 45"/><circle class="fl" cx="26.4" cy="46.6" r="2.1"/>
    <path class="ln" d="M57.4 29.5 Q68.6 37 72.6 45"/><circle class="fl" cx="73.6" cy="46.6" r="2.1"/>
    <path class="ln" d="M46 58.6 Q43.4 79 43.4 96"/><path class="ln" d="M54 58.6 Q56.6 79 56.6 96"/>
    <path class="ln" d="M43.4 96.6 L36.4 99"/><path class="ln" d="M56.6 96.6 L63.6 99"/>`
};

function fig(pose, x, footY, h, o){
  o = o||{};
  const s = h/100;
  const inner = POSES[pose](o);
  const flip = o.flip ? `<g transform="translate(100,0) scale(-1,1)">${inner}</g>` : inner;
  const shadow = o.noShadow ? '' :
    `<ellipse cx="${x}" cy="${footY+2}" rx="${h*0.20}" ry="${h*0.045}" fill="#1b1b1b" opacity=".13"/>`;
  return shadow + `<g transform="translate(${x-50*s},${footY-100*s}) scale(${s})">${flip}</g>`;
}

/* silhueta distante */
function sil(x, footY, h, o){
  o=o||{};
  const s=h/100;
  return `<g transform="translate(${x-50*s},${footY-100*s}) scale(${s})" opacity="${o.op||.8}">
    <path class="fl" d="M50 2 a8 8 0 0 1 0 16 a8 8 0 0 1 0 -16 Z"/>
    <path class="fl" d="M42 20 Q50 17 58 20 L57 56 L54 56 L53 96 L47 96 L46 56 L43 56 Z"/>
  </g>`;
}

/* Luci — orbe companion */
function luci(cx, cy, r, mood){
  const halo = `<circle class="ln-t" cx="${cx}" cy="${cy}" r="${r*1.34}" stroke-dasharray="2.5 5" opacity=".6"/>`;
  const shade = `<path d="M${cx-r} ${cy} a${r} ${r} 0 0 0 ${r*2} 0 a${r} ${r} 0 0 0 ${-r*2} 0"
      fill="url(#hL)" opacity=".8"/>`;
  let face;
  if(mood==='glitch'){
    face = `<path class="ln-t" d="M${cx-r*0.46} ${cy-r*0.3} l${r*0.26} ${r*0.26} l${-r*0.26} ${r*0.26}
                M${cx+r*0.46} ${cy-r*0.3} l${-r*0.26} ${r*0.26} l${r*0.26} ${r*0.26}" stroke-width="1.6"/>
            <path class="ln-t" d="M${cx-r*0.42} ${cy+r*0.58} Q${cx} ${cy+r*0.1} ${cx+r*0.42} ${cy+r*0.58}" stroke-width="1.6"/>
            <path class="ln-t" d="M${cx-r*1.5} ${cy-r*0.4} l${r*0.5} ${r*0.16} M${cx+r*1.1} ${cy+r*0.5} l${r*0.5} ${-r*0.16}" opacity=".8"/>`;
  } else if(mood==='talk'){
    face = `<circle class="fl" cx="${cx-r*0.3}" cy="${cy-r*0.14}" r="${r*0.11}"/>
            <circle class="fl" cx="${cx+r*0.3}" cy="${cy-r*0.14}" r="${r*0.11}"/>
            <ellipse class="ln-t" cx="${cx}" cy="${cy+r*0.42}" rx="${r*0.2}" ry="${r*0.26}" stroke-width="1.4"/>`;
  } else {
    face = `<circle class="fl" cx="${cx-r*0.3}" cy="${cy-r*0.14}" r="${r*0.11}"/>
            <circle class="fl" cx="${cx+r*0.3}" cy="${cy-r*0.14}" r="${r*0.11}"/>
            <path class="ln-t" d="M${cx-r*0.34} ${cy+r*0.34} Q${cx} ${cy+r*0.72} ${cx+r*0.34} ${cy+r*0.34}" stroke-width="1.4"/>`;
  }
  return `${halo}<circle class="ln" cx="${cx}" cy="${cy}" r="${r}"/>${shade}${face}
          <path class="ln-t" d="M${cx} ${cy-r-3} v-${r*0.42}"/>`;
}

/* painel flutuante (UI do jogo dentro da cena) */
function slab(x,y,w,h,lines,o){
  o=o||{};
  let s=`<rect class="ln" x="${x}" y="${y}" width="${w}" height="${h}" rx="2"/>
         <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#hL)" opacity="${o.tone==null?.55:o.tone}"/>`;
  for(let i=0;i<lines;i++){
    const ly = y + 11 + i*((h-18)/Math.max(lines-1,1));
    const lw = (i%3===2? w*0.45 : w*0.7);
    s+=`<line class="ln-t" x1="${x+9}" y1="${ly}" x2="${x+9+lw}" y2="${ly}" opacity=".75"/>`;
  }
  return s;
}
function vignette(){
  return `<path d="M0 0 H130 Q60 40 0 62 Z" fill="url(#hM)" opacity=".28"/>
          <path d="M400 225 H268 Q340 186 400 164 Z" fill="url(#hM)" opacity=".26"/>`;
}

/* ============ quadros ============ */
const SHOTS = [];

/* 01 — menu principal: jogador de costas diante do letreiro */
SHOTS[0] = `
  ${sky(.55)}
  ${band(0,0,400,96,'hM',.3)}
  ${ground(168,5)}${persp(168,200,7)}
  <g class="pencil">
    <path class="ln" d="M104 44 H296 V116 H104 Z"/>
    ${band(104,44,192,72,'hL',.5)}
    <text x="200" y="80" text-anchor="middle" font-family="Caveat, cursive" font-size="30" fill="#1b1b1b">UtopIA</text>
    <line class="ln-t" x1="132" y1="92" x2="268" y2="92" opacity=".7"/>
    <line class="ln-t" x1="146" y1="101" x2="254" y2="101" opacity=".55"/>
    <line class="ln-t" x1="158" y1="109" x2="242" y2="109" opacity=".45"/>
    ${sil(52,172,44,{op:.35})}${sil(350,170,40,{op:.3})}
    ${fig('back',200,214,96,{})}
  </g>
  ${vignette()}${frameEdge()}`;

/* 02 — comando inválido */
SHOTS[1] = `
  ${sky(.4)}
  ${ground(176,4)}

 desc:"Lista da maior para a menor pontuação, legível no terminal, com retorno claro ao menu principal.",
 tags:["Ordenado por score","Retorno ao menu"]}
]
];

/* ============ montagem ============ */
const main = document.getElementById('main');
let n = 0;
DATA.forEach((group, i) => {
  const head = document.createElement('div');
  head.className = 'act-head';
  head.innerHTML = `<span class="n">${i+1}</span><span class="t">${ACTS[i].name}</span><span class="r">${ACTS[i].range}</span>`;
  main.appendChild(head);

  const grid = document.createElement('div');
  grid.className = 'grid';
  group.forEach(p => {
    n++;
    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.setAttribute('tabindex','0');
    panel.setAttribute('role','button');
    panel.innerHTML = `
      <div class="shot">
        <svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg"><g clip-path="url(#fr)">${SHOTS[n-1]}</g></svg>
        <span class="idx">${n}</span>
        <span class="us">${p.code}</span>
      </div>
      <div class="cap">
        <span class="cam">${p.cam} —</span>
        <p>${p.cap}</p>
        <span class="plus">+</span>
      </div>
      <div class="more"><div class="more-in">
        <p>${p.desc}</p>
        <div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      </div></div>`;
    const toggle = () => panel.classList.toggle('open');
    panel.addEventListener('click', toggle);
    panel.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); }
    });
    grid.appendChild(panel);
  });
  main.appendChild(grid);
});
</script>

</body>
</html>
